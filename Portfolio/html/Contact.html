<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/wbt-fall-2025-26/Portfolio/css/contact.css">
</head>

<body>
    <form id="form">
        <h2>Contact Me</h2>

        <div>
            <label for="Firstname">First Name :</label>
            <input type="text" id="Firstname" name="firstname" required>
        </div>

        <div>
            <label for="Lastname">Last Name :</label>
            <input type="text" id="Lastname" name="lastname" required>
        </div>

        <div>
            <label for="Email">Email Address :</label>
            <input type="email" id="Email" name="email" required>
        </div>

        <div>
            <label for="company">Company :</label>
            <input type="text" id="company" name="company">
        </div>

        <div>
            <label>Reason For Contact :</label>
            <div class="radio-group">
                <input type="radio" id="thesis" name="reason_to_contact" value="thesis" required>
                <label for="thesis">Thesis</label>

                <input type="radio" id="project" name="reason_to_contact" value="project" required>
                <label for="project">Project</label>

                <input type="radio" id="job" name="reason_to_contact" value="job" required>
                <label for="job">Job</label>
            </div>
        </div>

        <div>
            <label>Service to Provide :</label>
            <div class="checkbox-group">
                <input type="checkbox" id="webdev" name="service" value="webdev" required>
                <label for="webdev">Web Development</label>

                <input type="checkbox" id="mobiledev" name="service" value="mobiledev" required>
                <label for="mobiledev">Mobile Application Development</label>

                <input type="checkbox" id="softdev" name="service" value="softdev" required>
                <label for="softdev">Software Development</label>
            </div>
        </div>

        <div>
            <label for="appointment">Book An Appointment:</label>
            <input type="date" id="appointment" name="appointment" required>
        </div>

        <div>
            <button type="submit" name="submit">Submit</button>
            <button type="reset" name="reset">Reset</button>
        </div>
    </form>
</body>

</html>
